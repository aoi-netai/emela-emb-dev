[package]
name = "emela-codegen-emb"
description = "Emits C for embedded targets from Emela Flow IR"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
emela-core.workspace = true
emela-lir.workspace = true
la-arena.workspace = true

[dev-dependencies]
emela-resolve.workspace = true
emela-syntax.workspace = true
emela-types.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn = { version = "2", features = ["full", "visit"] }
tempfile.workspace = true
